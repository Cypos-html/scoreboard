<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/png" href="Pictures/favicon.png">
    <link rel="stylesheet" href="style2.css">
    <link rel="manifest" href="manifest.json">

    <title>Goalscore counter</title>
</head>
<body>
    
    <script src="index.js"></script>

    <header><h1>Floorball score</h1></header>

    <main>

        <div class="scorebox">

            <button onclick="homeTeamScore()" id="homeTeam">
                <p id="homescore">0</p>
            </button>

            <button onclick="awayTeamScore()" id="awayTeam">
                <p id="awayscore">0</p>
            </button>

            <script>
                let homescore = 0
                let awayscore = 0

                function homeTeamScore(){
                    homescore++;
                    document.getElementById("homescore").innerHTML = homescore;
                    console.log("Home team score: " + homescore);
                    console.log("Type: " + typeof homescore);
                }
                function awayTeamScore() {
                    awayscore++;
                    document.getElementById("awayscore").innerHTML = awayscore;
                    console.log("Home team score: " + awayscore);
                    console.log("Type: " + typeof awayscore);
                }
            </script>
        </div>

        <div class="resetbox">

            <button onclick="resetScore()" id="resetbutton">
                RESET
            </button>

            <script>
                function resetScore() {
                    homescore = 0;
                    awayscore = 0;
                    document.getElementById("homescore").innerHTML = homescore;
                    document.getElementById("awayscore").innerHTML = awayscore;
                    console.log("Home team score: " + homescore);
                    console.log("Home team score: " + awayscore);
                }
            </script>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
