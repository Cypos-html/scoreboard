<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/png" href="Pictures/favicon.png">
    <link rel="stylesheet" href="style2.css">
    <link rel="manifest" href="manifest.json">

    <title>Goalscore counter</title>
</head>
<body>
    
    <script src="index.js"></script>

    <header><h1>Floorball score</h1></header>

    <main>

        <div class="scorebox">

            <button onclick="homeTeamScore()" id="homeTeam">
                <p id="homescore">0</p>
            </button>

            <button onclick="awayTeamScore()" id="awayTeam">
                <p id="awayscore">0</p>
            </button>

            <script>
                let homescore = 0;
                let awayscore = 0;
                let history = [];

                function homeTeamScore(){
                    homescore++;
                    history.push("home");
                    updateScore();
                    updateUndoButton();

                    console.log("Home team score: " + homescore);
                }
                function awayTeamScore() {
                    awayscore++;
                    history.push("away");
                    updateScore();
                    updateUndoButton();

                    console.log("Away team score: " + awayscore);
                }
            </script>
        </div>

        <div class="resetbox">

            <button onclick="resetScore()" id="resetButton" style="display: none;">
                RESET
            </button>

            <script>
                function updateUndoButton() {
                    let backButton = document.getElementById("backButton");
                    let resetButton = document.getElementById("resetButton");
                    let infoText = document.getElementById("infoText");

                    if (history.length === 0) {
                        backButton.style.display = "none";
                        resetButton.style.display = "none";
                        infoText.style.display = "block";
                    } else {
                        backButton.style.display = "block";
                        resetButton.style.display = "block";
                        infoText.style.display = "none";
                    }
                }

                function resetScore() {
                    homescore = 0;
                    awayscore = 0;
                    history = [];
                    updateUndoButton();

                    document.getElementById("homescore").innerHTML = homescore;
                    document.getElementById("awayscore").innerHTML = awayscore;
                    
                    console.log("Home team score: " + homescore);
                    console.log("Home team score: " + awayscore);
                    console.log(history)
                }
           </script>
            <button onclick="Undo()" id="backButton" style="display: none;">
                BACK
            </button>
            <script>
                function Undo() {
                    let lastAction = history.pop();

                        if (lastAction === "home") {
                            homescore--;
                        }

                        if (lastAction === "away") {
                            awayscore--;
                        }

                    updateScore();
                    updateUndoButton();

                    console.log(lastAction)
                    console.log(history)
                }

                function updateScore() {
                    document.getElementById("homescore").innerHTML = homescore;
                    document.getElementById("awayscore").innerHTML = awayscore;
                }
            </script>
            <button id="infoText" style="display: block;">
                For START press score button
            </button>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
