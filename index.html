<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/png" href="Pictures/favicon.png">
    <link rel="stylesheet" href="style2.css">
    <link rel="manifest" href="manifest.json">

    <title>Goalscore counter</title>
</head>
<body>
    
    <header>
        <div id="clock"></div>
        <h1>Floorball score</h1>
    </header>

    <main>        
        <div class="scorebox">

            <button onclick="homeTeamScore()" id="homeTeam">
                <p id="homescore">0</p>
            </button>

            <button onclick="awayTeamScore()" id="awayTeam">
                <p id="awayscore">0</p>
            </button>

        </div>

        <div class="resetbox">

            <button onclick="resetScore()" id="resetButton" style="display: none;">
                RESET
            </button>

            <button onclick="back()" id="backButton" style="display: none;">
                BACK
            </button>

            <button id="infoText" style="display: block;">
                For START press score button
            </button>
            
        </div>
    </main>
    
    <footer>
    </footer>

    <script src="index.js"></script>

</body>
</html>
